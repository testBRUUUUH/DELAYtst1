name: Build macOS plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect and sign
        run: |
          mkdir dist
          find build/DubDelay_artefacts -name "*.vst3" -prune -exec cp -R {} dist/ \;
          find build/DubDelay_artefacts -name "*.component" -prune -exec cp -R {} dist/ \;
          for f in dist/*; do codesign --force --deep --sign - "$f"; done
          cd dist && zip -ry ../DubDelay-macOS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: DubDelay-macOS
          path: DubDelay-macOS.zip
